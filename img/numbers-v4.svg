<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" role="img" aria-label="Three years building AI systems. Twenty-four hours in one run, unattended. First on MLE-Bench at submission. Eight weeks from joining to paying customers."><style>:root{--bg:#ffffff;--paper:#fffbf3;--ink:#2b241d;--muted:#655a4c;--line:#d8d2c6;--tomato:#2f5d50;--onhot:#fbf6ea;--soft:#f1e7d4;--mustard:#ebd398;--leaf:#3f7a66;--shade:#dccdb2;--edge:#4b3d30;--clay:#b4583a;}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--paper:#221d17;--ink:#f1e7d6;--muted:#bbae99;--line:#4a4136;--tomato:#8cc5ae;--onhot:#12201b;--soft:#2a231c;--mustard:#ddbf78;--leaf:#6fae98;--shade:#0a0806;--edge:#7d6e5c;--clay:#e39a76;}}</style><rect x="8" y="13" width="286" height="150" rx="14" style="fill:var(--shade)"/><rect x="8" y="8" width="286" height="150" rx="14" stroke-width="2" style="fill:var(--paper);stroke:var(--edge)"/><text x="30" y="78" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="56" font-weight="800" text-anchor="start" letter-spacing="-2" style="fill:var(--ink)">3</text><text x="70" y="78" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="12.5" font-weight="500" text-anchor="start" letter-spacing="1.6" style="fill:var(--tomato)">YEARS</text><text x="30" y="110" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="14.5" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:var(--ink)">building AI systems</text><text x="30" y="134" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:var(--muted)">Research first, then production.</text><rect x="306" y="13" width="286" height="150" rx="14" style="fill:var(--shade)"/><rect x="306" y="8" width="286" height="150" rx="14" stroke-width="2" style="fill:var(--paper);stroke:var(--edge)"/><text x="328" y="78" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="56" font-weight="800" text-anchor="start" letter-spacing="-2" style="fill:var(--ink)">24</text><text x="408" y="78" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="12.5" font-weight="500" text-anchor="start" letter-spacing="1.6" style="fill:var(--tomato)">HOURS</text><text x="328" y="110" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="14.5" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:var(--ink)">in one run, unattended</text><text x="328" y="134" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:var(--muted)">Hundreds of experiments in each.</text><rect x="604" y="13" width="286" height="150" rx="14" style="fill:var(--shade)"/><rect x="604" y="8" width="286" height="150" rx="14" stroke-width="2" style="fill:var(--paper);stroke:var(--edge)"/><text x="626" y="78" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="56" font-weight="800" text-anchor="start" letter-spacing="-2" style="fill:var(--ink)">#1</text><text x="626" y="110" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="14.5" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:var(--ink)">on MLE-Bench, at submission</text><text x="626" y="134" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:var(--muted)">Leaderboards move. It was true then.</text><rect x="902" y="13" width="286" height="150" rx="14" style="fill:var(--shade)"/><rect x="902" y="8" width="286" height="150" rx="14" stroke-width="2" style="fill:var(--paper);stroke:var(--edge)"/><text x="924" y="78" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="56" font-weight="800" text-anchor="start" letter-spacing="-2" style="fill:var(--ink)">8</text><text x="964" y="78" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="12.5" font-weight="500" text-anchor="start" letter-spacing="1.6" style="fill:var(--tomato)">WEEKS</text><text x="924" y="110" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="14.5" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:var(--ink)">from joining to paying customers</text><text x="924" y="134" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:var(--muted)">As the only engineer on the system.</text></svg>