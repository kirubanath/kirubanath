<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" role="img" aria-label="Three years building AI systems. Twenty-four hours in one run, unattended. First on MLE-Bench at submission. Eight weeks from joining to paying customers."><style>:root{--bg:#ffffff;--paper:#f6f9f5;--ink:#222924;--muted:#566059;--line:#d3dad2;--tomato:#2f5d50;--onhot:#fafbf8;--soft:#f0f4ef;--mustard:#ebd398;--leaf:#3f7a66;--shade:#d3dad3;--edge:#3a463f;--clay:#b4583a;--tint:#dde9df;}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--paper:#221d17;--ink:#f1e7d6;--muted:#bbae99;--line:#4a4136;--tomato:#8cc5ae;--onhot:#12201b;--soft:#2a231c;--mustard:#ddbf78;--leaf:#6fae98;--shade:#0a0806;--edge:#7d6e5c;--clay:#e39a76;--tint:#ddbf78;}}</style><path d="M8 10 H1192 M8 160 H1192" stroke-width="1.5" style="stroke:var(--line)"/><text x="22" y="78" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="56" font-weight="800" text-anchor="start" letter-spacing="-2" style="fill:var(--ink)">3</text><text x="62" y="78" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="12.5" font-weight="500" text-anchor="start" letter-spacing="1.6" style="fill:var(--tomato)">YEARS</text><text x="22" y="110" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="14.5" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:var(--ink)">building AI systems</text><text x="22" y="134" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:var(--muted)">Research first, then production.</text><path d="M300 10 V160" stroke-width="1.5" style="stroke:var(--line)"/><text x="320" y="78" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="56" font-weight="800" text-anchor="start" letter-spacing="-2" style="fill:var(--ink)">24</text><text x="400" y="78" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="12.5" font-weight="500" text-anchor="start" letter-spacing="1.6" style="fill:var(--tomato)">HOURS</text><text x="320" y="110" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="14.5" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:var(--ink)">in one run, unattended</text><text x="320" y="134" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:var(--muted)">Hundreds of experiments in each.</text><path d="M598 10 V160" stroke-width="1.5" style="stroke:var(--line)"/><text x="618" y="78" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="56" font-weight="800" text-anchor="start" letter-spacing="-2" style="fill:var(--ink)">#1</text><text x="618" y="110" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="14.5" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:var(--ink)">on MLE-Bench, at submission</text><text x="618" y="134" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:var(--muted)">Leaderboards move. It was true then.</text><path d="M896 10 V160" stroke-width="1.5" style="stroke:var(--line)"/><text x="916" y="78" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="56" font-weight="800" text-anchor="start" letter-spacing="-2" style="fill:var(--ink)">8</text><text x="956" y="78" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="12.5" font-weight="500" text-anchor="start" letter-spacing="1.6" style="fill:var(--tomato)">WEEKS</text><text x="916" y="110" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="14.5" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:var(--ink)">from joining to paying customers</text><text x="916" y="134" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:var(--muted)">As the only engineer on the system.</text></svg>