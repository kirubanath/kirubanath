<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 588 276" role="img" aria-label="Five agents run my job search. They read the job sites, draft the letters and keep score in a spreadsheet. They are not allowed to click Apply. A person does that part, and the person is me."><style>:root{--bg:#ffffff;--paper:#fffbf3;--ink:#2b241d;--muted:#655a4c;--line:#d8d2c6;--tomato:#2f5d50;--onhot:#fbf6ea;--soft:#f1e7d4;--mustard:#ebd398;--leaf:#3f7a66;--shade:#dccdb2;--edge:#4b3d30;--clay:#b4583a;}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--paper:#221d17;--ink:#f1e7d6;--muted:#bbae99;--line:#4a4136;--tomato:#8cc5ae;--onhot:#12201b;--soft:#2a231c;--mustard:#ddbf78;--leaf:#6fae98;--shade:#0a0806;--edge:#7d6e5c;--clay:#e39a76;}}</style><rect x="5" y="11" width="570" height="256" rx="14" style="fill:var(--shade)"/><rect x="5" y="6" width="570" height="256" rx="14" stroke-width="2" style="fill:var(--paper);stroke:var(--edge)"/><rect x="28" y="28" width="116.4" height="24" rx="12" stroke-width="0" style="fill:var(--mustard);stroke:var(--edge)"/><text x="86.2" y="44.5" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="11.5" font-weight="500" text-anchor="middle" letter-spacing="1.2" fill="#26211c">OPEN SOURCE</text><text x="547" y="45" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="11.5" font-weight="400" text-anchor="end" letter-spacing="1.4" style="fill:var(--muted)">FIG. 5</text><text x="28" y="96" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="27" font-weight="800" text-anchor="start" letter-spacing="-0.6" style="fill:var(--ink)">Five agents run my job search</text><text x="28" y="130" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="15.5" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:var(--muted)">They read the job sites, draft the letters and keep score</text><text x="28" y="154" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="15.5" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:var(--muted)">in a spreadsheet. They are not allowed to click Apply.</text><text x="28" y="178" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="15.5" font-weight="400" text-anchor="start" letter-spacing="0" style="fill:var(--muted)">A person does that part, and the person is me.</text><path d="M28 214H552" stroke-width="1.4" stroke-dasharray="4 4" style="stroke:var(--line)"/><text x="28" y="241" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="11.5" font-weight="400" text-anchor="start" letter-spacing="1.2" style="fill:var(--muted)">AGENTS  ·  OPEN SOURCE</text><text x="552" y="241" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="11.5" font-weight="500" text-anchor="end" letter-spacing="1.2" style="fill:var(--tomato)">SEE HOW IT WORKS &#8594;</text></svg>