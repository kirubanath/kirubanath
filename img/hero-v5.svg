<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="Kirubananth Sankar, AI engineer, Hyderabad. I build AI systems that work when nobody is watching. A drawing of an empty desk with a laptop working by itself."><style>:root{--bg:#ffffff;--paper:#fffbf3;--ink:#2b241d;--muted:#655a4c;--line:#d8d2c6;--tomato:#2f5d50;--onhot:#fbf6ea;--soft:#f1e7d4;--mustard:#ebd398;--leaf:#3f7a66;--shade:#dccdb2;--edge:#4b3d30;--clay:#b4583a;}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--paper:#221d17;--ink:#f1e7d6;--muted:#bbae99;--line:#4a4136;--tomato:#8cc5ae;--onhot:#12201b;--soft:#2a231c;--mustard:#ddbf78;--leaf:#6fae98;--shade:#0a0806;--edge:#7d6e5c;--clay:#e39a76;}}</style><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFDDEE"/><stop offset="1" stop-color="#F6EBD0"/></linearGradient><clipPath id="wc"><path d="M52 214 V112 a74 74 0 0 1 148 0 V214 Z"/></clipPath></defs><rect x="4" y="4" width="1192" height="422" rx="22" style="fill:var(--paper)"/><circle cx="52" cy="92" r="5" style="fill:var(--clay)"/><text x="68" y="97" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="13" font-weight="500" text-anchor="start" letter-spacing="2" style="fill:var(--muted)">KIRUBANANTH SANKAR  ·  AI ENGINEER  ·  HYDERABAD</text><text x="46" y="178" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="58" font-weight="800" text-anchor="start" letter-spacing="-1.9" style="fill:var(--ink)">I build AI systems</text><text x="46" y="244" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="58" font-weight="800" text-anchor="start" letter-spacing="-1.9" style="fill:var(--ink)">that work when</text><text x="46" y="310" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="58" font-weight="800" text-anchor="start" letter-spacing="-1.9" style="fill:var(--i