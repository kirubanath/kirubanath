<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="Kirubananth Sankar. I build AI systems that work when nobody is watching. Research to production."><style>.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}:root{--bg:#ffffff;--paper:#fffdf8;--ink:#26211c;--muted:#5e564a;--line:#d8d2c6;--tomato:#2f5d50;--onhot:#fbf6ea;--soft:#f6efe2;--mustard:#ebd398;--leaf:#3f7a66;--shade:#d8cbb2;}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--paper:#161b22;--ink:#f4eddf;--muted:#a9a295;--line:#3a3f47;--tomato:#8cc5ae;--onhot:#12201b;--soft:#1f242c;--mustard:#d9be7a;--leaf:#6fae98;--shade:#05070a;}}</style><rect x="8" y="8" width="1184" height="414" rx="18" stroke-width="2.5" style="fill:var(--paper);stroke:var(--ink)"/><circle cx="52" cy="62" r="5" style="fill:var(--tomato)"/><text x="68" y="67" class="m" font-size="13" font-weight="500" letter-spacing="2" style="fill:var(--muted)">AI ENGINEER  ·  RESEARCH TO PRODUCTION  ·  HYDERABAD</text><text x="46" y="148" class="s" font-size="58" font-weight="800" letter-spacing="-1.9" style="fill:var(--ink)">I build AI systems</text><text x="46" y="214" class="s" font-size="58" font-weight="800" letter-spacing="-1.9" style="fill:var(--ink)">that work when</text><text x="46" y="280" class="s" font-size="58" font-weight="800" letter-spacing="-1.9" style="fill:var(--ink)"><tspan style="fill:var(--tomato)">nobody is watching</tspan>.</text><text x="48" y="352" class="s" font-size="19" style="fill:var(--muted)">Hi, I&#39;m Kirubananth. Eleven letters, take your time.</text><text x="48" y="380" class="s" font-size="19" style="fill:var(--muted)">The username is missing an &#8220;n&#8221;. We don&#39;t talk about it.</text><g transform="rotate(1.6 974.0 215)"><rect x="807" y="77" width="348" height="290" rx="14" style="fill:var(--shade)"/><rect x="800" y="70" width="348" height="290" rx="14" stroke-width="2.5" style="fill:var(--paper);stroke:var(--ink)"/><path d="M800 110H1148" stroke-width="2.5" style="stroke:var(--ink)"/><circle cx="822" cy="91" r="5.5" stroke-width="1.6" style="fill:var(--tomato);stroke:var(--ink)"/><circle cx="839" cy="91" r="5.5" stroke-width="1.6" style="fill:var(--mustard);stroke:var(--ink)"/><circle cx="856" cy="91" r="5.5" stroke-width="1.6" style="fill:var(--leaf);stroke:var(--ink)"/><text x="878" y="96" class="m" font-size="12.5" style="fill:var(--ink)">one_run.log</text><text x="820" y="142" class="m" font-size="12.5" font-weight="500" style="fill:var(--tomato)">00:00</text><text x="874" y="142" class="m" font-size="12.5" style="fill:var(--ink)">task read, plan drafted</text><text x="820" y="171" class="m" font-size="12.5" font-weight="500" style="fill:var(--tomato)">03:12</text><text x="874" y="171" class="m" font-size="12.5" style="fill:var(--ink)">rate limit. waiting, retrying</text><text x="820" y="200" class="m" font-size="12.5" font-weight="500" style="fill:var(--tomato)">07:40</text><text x="874" y="200" class="m" font-size="12.5" style="fill:var(--ink)">server error. resumed</text><text x="820" y="229" class="m" font-size="12.5" font-weight="500" style="fill:var(--tomato)">11:26</text><text x="874" y="229" class="m" font-size="12.5" style="fill:var(--ink)">judge rejected a solution</text><text x="820" y="258" class="m" font-size="12.5" font-weight="500" style="fill:var(--tomato)">17:05</text><text x="874" y="258" class="m" font-size="12.5" style="fill:var(--ink)">merged the two best ideas</text><text x="820" y="287" class="m" font-size="12.5" font-weight="500" style="fill:var(--tomato)">24:00</text><text x="874" y="287" class="m" font-size="12.5" style="fill:var(--ink)">submitted. nobody touched it</text><path d="M800 318H1148V346a14 14 0 0 1 -14 14H814a14 14 0 0 1 -14 -14Z" style="fill:var(--ink)"/><text x="820" y="344" class="m" font-size="12.5" style="fill:var(--paper)">&gt; status: done</text></g></svg>
