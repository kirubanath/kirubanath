<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="Kirubananth Sankar. I build AI agents. Then I tell them what they are not allowed to do."><style>.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}:root{--bg:#ffffff;--paper:#fffdf8;--ink:#26211c;--muted:#5e564a;--line:#d8d2c6;--tomato:#2f5d50;--onhot:#fbf6ea;--soft:#f6efe2;--mustard:#ebd398;--leaf:#3f7a66;--shade:#d8cbb2;}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--paper:#161b22;--ink:#f4eddf;--muted:#a9a295;--line:#3a3f47;--tomato:#8cc5ae;--onhot:#12201b;--soft:#1f242c;--mustard:#d9be7a;--leaf:#6fae98;--shade:#05070a;}}</style><rect x="8" y="8" width="1184" height="414" rx="18" stroke-width="2.5" style="fill:var(--paper);stroke:var(--ink)"/><circle cx="52" cy="62" r="5" style="fill:var(--tomato)"/><text x="68" y="67" class="m" font-size="13" font-weight="500" letter-spacing="2" style="fill:var(--muted)">APPLIED AI ENGINEER  ·  HYDERABAD, INDIA</text><text x="46" y="150" class="s" font-size="58" font-weight="800" letter-spacing="-1.8" style="fill:var(--ink)">I build AI agents.</text><text x="46" y="216" class="s" font-size="58" font-weight="800" letter-spacing="-1.8" style="fill:var(--ink)">Then I tell them what</text><text x="46" y="282" class="s" font-size="58" font-weight="800" letter-spacing="-1.8" style="fill:var(--ink)">they are <tspan style="fill:var(--tomato)">not allowed</tspan> to do.</text><text x="48" y="352" class="s" font-size="19" style="fill:var(--muted)">Hi, I&#39;m Kirubananth. Eleven letters, take your time.</text><text x="48" y="380" class="s" font-size="19" style="fill:var(--muted)">The username is missing an &#8220;n&#8221;. We don&#39;t talk about it.</text><g transform="rotate(1.6 974.0 215)"><rect x="807" y="77" width="348" height="290" rx="14" style="fill:var(--shade)"/><rect x="800" y="70" width="348" height="290" rx="14" stroke-width="2.5" style="fill:var(--paper);stroke:var(--ink)"/><path d="M800 110H1148" stroke-width="2.5" style="stroke:var(--ink)"/><circle cx="822" cy="91" r="5.5" stroke-width="1.6" style="fill:var(--tomato);stroke:var(--ink)"/><circle cx="839" cy="91" r="5.5" stroke-width="1.6" style="fill:var(--mustard);stroke:var(--ink)"/><circle cx="856" cy="91" r="5.5" stroke-width="1.6" style="fill:var(--leaf);stroke:var(--ink)"/><text x="878" y="96" class="m" font-size="12.5" style="fill:var(--ink)">agent_permissions.txt</text><text x="820" y="149" class="s" font-size="15.5" font-weight="500" style="fill:var(--ink)">Write the wording</text><rect x="1080" y="131" width="48" height="26" rx="13" stroke-width="2" style="fill:var(--leaf);stroke:var(--ink)"/><circle cx="1115" cy="144" r="8" style="fill:var(--paper)"/><path d="M818 168H1130" stroke-width="1.4" stroke-dasharray="4 4" style="stroke:var(--line)"/><text x="820" y="197" class="s" font-size="15.5" font-weight="500" style="fill:var(--ink)">Write a number</text><rect x="1080" y="179" width="48" height="26" rx="13" stroke-width="2" style="fill:var(--soft);stroke:var(--ink)"/><circle cx="1093" cy="192" r="8" style="fill:var(--ink)"/><path d="M818 216H1130" stroke-width="1.4" stroke-dasharray="4 4" style="stroke:var(--line)"/><text x="820" y="245" class="s" font-size="15.5" font-weight="500" style="fill:var(--ink)">Decide anything about money</text><rect x="1080" y="227" width="48" height="26" rx="13" stroke-width="2" style="fill:var(--soft);stroke:var(--ink)"/><circle cx="1093" cy="240" r="8" style="fill:var(--ink)"/><path d="M818 264H1130" stroke-width="1.4" stroke-dasharray="4 4" style="stroke:var(--line)"/><text x="820" y="293" class="s" font-size="15.5" font-weight="500" style="fill:var(--ink)">Sulk about all of the above</text><rect x="1080" y="275" width="48" height="26" rx="13" stroke-width="2" style="fill:var(--leaf);stroke:var(--ink)"/><circle cx="1115" cy="288" r="8" style="fill:var(--paper)"/><path d="M800 318H1148V346a14 14 0 0 1 -14 14H814a14 14 0 0 1 -14 -14Z" style="fill:var(--ink)"/><text x="820" y="344" class="m" font-size="12.5" style="fill:var(--paper)">&gt; status: compliant, mildly resentful</text></g></svg>
