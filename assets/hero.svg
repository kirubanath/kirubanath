<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="Kirubananth Sankar. I build AI systems that work when nobody is watching. Research to production."><style>:root{--bg:#ffffff;--paper:#fffbf3;--ink:#2b241d;--muted:#655a4c;--line:#d8d2c6;--tomato:#2f5d50;--onhot:#fbf6ea;--soft:#f1e7d4;--mustard:#ebd398;--leaf:#3f7a66;--shade:#dccdb2;--edge:#4b3d30;--clay:#b4583a;}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--paper:#221d17;--ink:#f1e7d6;--muted:#bbae99;--line:#4a4136;--tomato:#8cc5ae;--onhot:#12201b;--soft:#2a231c;--mustard:#ddbf78;--leaf:#6fae98;--shade:#0a0806;--edge:#7d6e5c;--clay:#e39a76;}}</style><rect x="8" y="8" width="1184" height="414" rx="18" stroke-width="2" style="fill:var(--paper);stroke:var(--edge)"/><circle cx="52" cy="62" r="5" style="fill:var(--clay)"/><text x="68" y="67" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace' font-size="13" font-weight="500" text-anchor="start" letter-spacing="2" style="fill:var(--muted)">AI ENGINEER  ·  RESEARCH TO PRODUCTION  ·  HYDERABAD</text><text x="46" y="148" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="58" font-weight="800" text-anchor="start" letter-spacing="-1.9" style="fill:var(--ink)">I build AI systems</text><text x="46" y="214" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="58" font-weight="800" text-anchor="start" letter-spacing="-1.9" style="fill:var(--ink)">that work when</text><text x="46" y="280" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="58" font-weight="800" text-anchor="start" letter-spacing="-1.9" style="fill:var(--ink)"><tspan style="fill:var(--tomato)">nobody is watching</tspan>.</text><text x="48" y="352" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif' font-size="19" font-weight="400" text-anchor="start" letter-spacing="0" style="f