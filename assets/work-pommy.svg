<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 588 276" role="img" aria-label="Pommy. A focus timer for the Mac, narrated by a tomato with opinions. It wrote its own documentation. I was not consulted either."><style>.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}:root{--bg:#ffffff;--paper:#fffdf8;--ink:#17140f;--muted:#5e564a;--line:#d8d2c6;--tomato:#e8452c;--onhot:#fff7ee;--soft:#f6efe2;--mustard:#f6c644;--leaf:#2e7d4f;}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--paper:#161b22;--ink:#f4eddf;--muted:#a9a295;--line:#3a3f47;--tomato:#ff6347;--onhot:#1a0f0b;--soft:#1f242c;--mustard:#f6c644;--leaf:#57b77f;}}</style><rect x="11" y="13" width="570" height="256" rx="14" style="fill:var(--ink)"/><rect x="5" y="6" width="570" height="256" rx="14" stroke-width="2.5" style="fill:var(--paper);stroke:var(--ink)"/><rect x="28" y="28" width="108.0" height="24" rx="12" stroke-width="1.8" style="fill:var(--mustard);stroke:var(--ink)"/><text x="82.0" y="44.5" class="m" font-size="11.5" font-weight="500" text-anchor="middle" letter-spacing="1.2" style="fill:var(--ink)">SIDE QUEST</text><text x="547" y="45" class="m" font-size="11.5" text-anchor="end" letter-spacing="1.4" style="fill:var(--muted)">FIG. 4</text><text x="28" y="96" class="s" font-size="27" font-weight="800" letter-spacing="-0.6" style="fill:var(--ink)">Pommy</text><text x="28" y="130" class="s" font-size="15.5" style="fill:var(--muted)">A focus timer for the Mac, narrated by a tomato with</text><text x="28" y="154" class="s" font-size="15.5" style="fill:var(--muted)">opinions. It wrote its own documentation.</text><text x="28" y="178" class="s" font-size="15.5" style="fill:var(--muted)">I was not consulted either.</text><path d="M28 214H552" stroke-width="1.4" stroke-dasharray="4 4" style="stroke:var(--line)"/><text x="28" y="241" class="m" font-size="11.5" letter-spacing="1.2" style="fill:var(--muted)">SWIFT  ·  MACOS</text><text x="552" y="241" class="m" font-size="11.5" font-weight="500" text-anchor="end" letter-spacing="1.2" style="fill:var(--tomato)">MEET THE TOMATO &#8594;</text></svg>
