<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" role="img" aria-label="Three years building LLM agent systems. Eight weeks from joining to paying customers. One engineer on that system. First on MLE-Bench at submission."><style>.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}:root{--bg:#ffffff;--paper:#fffdf8;--ink:#17140f;--muted:#5e564a;--line:#d8d2c6;--tomato:#c2321a;--onhot:#fff7ee;--soft:#f6efe2;--mustard:#f6c644;--leaf:#2e7d4f;}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--paper:#161b22;--ink:#f4eddf;--muted:#a9a295;--line:#3a3f47;--tomato:#ff6347;--onhot:#1a0f0b;--soft:#1f242c;--mustard:#f6c644;--leaf:#57b77f;}}</style><rect x="13" y="13" width="286" height="150" rx="14" style="fill:var(--ink)"/><rect x="8" y="8" width="286" height="150" rx="14" stroke-width="2.5" style="fill:var(--paper);stroke:var(--ink)"/><text x="30" y="78" class="s" font-size="56" font-weight="800" letter-spacing="-2" style="fill:var(--ink)">3</text><text x="70" y="78" class="m" font-size="12.5" font-weight="500" letter-spacing="1.6" style="fill:var(--tomato)">YEARS</text><text x="30" y="110" class="s" font-size="14.5" style="fill:var(--ink)">building LLM agent systems</text><text x="30" y="134" class="s" font-size="13" style="fill:var(--muted)">Research first, then production.</text><rect x="311" y="13" width="286" height="150" rx="14" style="fill:var(--ink)"/><rect x="306" y="8" width="286" height="150" rx="14" stroke-width="2.5" style="fill:var(--tomato);stroke:var(--ink)"/><text x="328" y="78" class="s" font-size="56" font-weight="800" letter-spacing="-2" style="fill:var(--onhot)">8</text><text x="368" y="78" class="m" font-size="12.5" font-weight="500" letter-spacing="1.6" style="fill:var(--onhot)">WEEKS</text><text x="328" y="110" class="s" font-size="14.5" style="fill:var(--onhot)">from joining to paying customers</text><text x="328" y="134" class="s" font-size="13" style="fill:var(--onhot)">It felt longer.</text><rect x="609" y="13" width="286" height="150" rx="14" style="fill:var(--ink)"/><rect x="604" y="8" width="286" height="150" rx="14" stroke-width="2.5" style="fill:var(--paper);stroke:var(--ink)"/><text x="626" y="78" class="s" font-size="56" font-weight="800" letter-spacing="-2" style="fill:var(--ink)">1</text><text x="666" y="78" class="m" font-size="12.5" font-weight="500" letter-spacing="1.6" style="fill:var(--tomato)">ENGINEER</text><text x="626" y="110" class="s" font-size="14.5" style="fill:var(--ink)">on that system. Hello.</text><text x="626" y="134" class="s" font-size="13" style="fill:var(--muted)">Standups were efficient.</text><rect x="907" y="13" width="286" height="150" rx="14" style="fill:var(--ink)"/><rect x="902" y="8" width="286" height="150" rx="14" stroke-width="2.5" style="fill:var(--paper);stroke:var(--ink)"/><text x="924" y="78" class="s" font-size="56" font-weight="800" letter-spacing="-2" style="fill:var(--ink)">#1</text><text x="924" y="110" class="s" font-size="14.5" style="fill:var(--ink)">on MLE-Bench, at submission</text><text x="924" y="134" class="s" font-size="13" style="fill:var(--muted)">Leaderboards move. It was true then.</text></svg>
