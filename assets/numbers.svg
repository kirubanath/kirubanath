<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" role="img" aria-label="Three years building AI systems. Twenty-four hours in one run with nobody steering. First on MLE-Bench at submission. Eight weeks from joining to paying customers."><style>.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}:root{--bg:#ffffff;--paper:#fffdf8;--ink:#26211c;--muted:#5e564a;--line:#d8d2c6;--tomato:#2f5d50;--onhot:#fbf6ea;--soft:#f6efe2;--mustard:#ebd398;--leaf:#3f7a66;--shade:#d8cbb2;}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--paper:#161b22;--ink:#f4eddf;--muted:#a9a295;--line:#3a3f47;--tomato:#8cc5ae;--onhot:#12201b;--soft:#1f242c;--mustard:#d9be7a;--leaf:#6fae98;--shade:#05070a;}}</style><rect x="13" y="13" width="286" height="150" rx="14" style="fill:var(--shade)"/><rect x="8" y="8" width="286" height="150" rx="14" stroke-width="2.5" style="fill:var(--paper);stroke:var(--ink)"/><text x="30" y="78" class="s" font-size="56" font-weight="800" letter-spacing="-2" style="fill:var(--ink)">3</text><text x="70" y="78" class="m" font-size="12.5" font-weight="500" letter-spacing="1.6" style="fill:var(--tomato)">YEARS</text><text x="30" y="110" class="s" font-size="14.5" style="fill:var(--ink)">building AI systems</text><text x="30" y="134" class="s" font-size="13" style="fill:var(--muted)">Research first, then production.</text><rect x="311" y="13" width="286" height="150" rx="14" style="fill:var(--shade)"/><rect x="306" y="8" width="286" height="150" rx="14" stroke-width="2.5" style="fill:var(--tomato);stroke:var(--ink)"/><text x="328" y="78" class="s" font-size="56" font-weight="800" letter-spacing="-2" style="fill:var(--onhot)">24</text><text x="408" y="78" class="m" font-size="12.5" font-weight="500" letter-spacing="1.6" style="fill:var(--onhot)">HOURS</text><text x="328" y="110" class="s" font-size="14.5" style="fill:var(--onhot)">in one run, nobody steering</text><text x="328" y="134" class="s" font-size="13" style="fill:var(--onhot)">Hundreds of experiments in each.</text><rect x="609" y="13" width="286" height="150" rx="14" style="fill:var(--shade)"/><rect x="604" y="8" width="286" height="150" rx="14" stroke-width="2.5" style="fill:var(--paper);stroke:var(--ink)"/><text x="626" y="78" class="s" font-size="56" font-weight="800" letter-spacing="-2" style="fill:var(--ink)">#1</text><text x="626" y="110" class="s" font-size="14.5" style="fill:var(--ink)">on MLE-Bench, at submission</text><text x="626" y="134" class="s" font-size="13" style="fill:var(--muted)">Leaderboards move. It was true then.</text><rect x="907" y="13" width="286" height="150" rx="14" style="fill:var(--shade)"/><rect x="902" y="8" width="286" height="150" rx="14" stroke-width="2.5" style="fill:var(--paper);stroke:var(--ink)"/><text x="924" y="78" class="s" font-size="56" font-weight="800" letter-spacing="-2" style="fill:var(--ink)">8</text><text x="964" y="78" class="m" font-size="12.5" font-weight="500" letter-spacing="1.6" style="fill:var(--tomato)">WEEKS</text><text x="924" y="110" class="s" font-size="14.5" style="fill:var(--ink)">from joining to paying customers</text><text x="924" y="134" class="s" font-size="13" style="fill:var(--muted)">As the only engineer on the system.</text></svg>
